; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32@7.1.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv
extra_scripts = pre:scripts/fw_version.py
; NimBLE instead of Bluedroid: Bluedroid links Classic BT + BLE Mesh from the
; prebuilt SDK (~590 KB flash) and leaves too little heap for TLS.
; ESP32 BLE Keyboard 0.3.2 only supports the NimBLE-Arduino 1.x API (not 2.x).
build_flags =
    -D USE_NIMBLE
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
    h2zero/NimBLE-Arduino@~1.4.3
    T-vK/ESP32 BLE Keyboard@^0.3.2
    xreef/PCF8575 library@^2.0.1
    zinggjm/GxEPD2@^1.5.4
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit BusIO@^1.14.1
