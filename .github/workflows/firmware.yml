name: Firmware release

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "platformio.ini"
      - "scripts/**"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        env:
          FW_VERSION: ${{ github.run_number }}
        run: pio run -e esp32dev

      - name: Package release
        run: |
          BIN=.pio/build/esp32dev/firmware.bin
          mkdir -p dist
          cp "$BIN" dist/firmware.bin
          SIZE=$(stat -c %s dist/firmware.bin)
          MD5=$(md5sum dist/firmware.bin | cut -d' ' -f1)
          NOTES=$(git log -1 --format=%s)
          jq -cn --argjson version "${{ github.run_number }}" --arg md5 "$MD5" \
            --argjson size "$SIZE" --arg notes "$NOTES" \
            '{version: $version, md5: $md5, size: $size, notes: $notes}' > dist/version.json
          cat dist/version.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fw-${{ github.run_number }}
          name: Firmware v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/firmware.bin
            dist/version.json
